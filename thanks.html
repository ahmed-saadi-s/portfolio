<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success - Ahmed Saadi</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 5L93 28V72L50 95L7 72V28L50 5Z' fill='%2306b6d4' stroke='none'/><path d='M38 35L28 50L38 65' stroke='%23f1f5f9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M56 30L44 70' stroke='%23f1f5f9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M62 35L72 50L62 65' stroke='%23f1f5f9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Translations -->
    <script src="js/i18n.js"></script>

    <style>
        :root {
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.4);
        }

        body {
            background-color: #050810;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-portal {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
        }

        .success-badge {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 4rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(6, 182, 212, 0.1);
            position: relative;
            overflow: hidden;
        }

        .success-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
            animation: shine 3s infinite;
        }

        @keyframes shine {
            to {
                left: 100%;
            }
        }

        .icon-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2.5rem;
            position: relative;
            box-shadow: 0 0 30px var(--accent-glow);
            background: rgba(6, 182, 212, 0.05);
        }

        .icon-ring svg {
            width: 50px;
            height: 50px;
            color: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        .pulse-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: pulse-out 2s infinite linear;
            opacity: 0;
        }

        @keyframes pulse-out {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .countdown-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--accent);
            width: 100%;
            transform-origin: left;
            animation: countdown 5s linear forwards;
        }

        @keyframes countdown {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
            z-index: 1;
        }
    </style>
</head>

<body x-data="{
    locale: localStorage.getItem('portfolio-lang') || 'en',
    t: translations[localStorage.getItem('portfolio-lang') || 'en'],
    timer: 5,
    init() {
        document.documentElement.setAttribute('dir', this.t.dir);
        document.documentElement.setAttribute('lang', this.t.lang);
        document.body.style.fontFamily = this.t.fontFamily;
        let countdown = setInterval(() => {
            if (this.timer > 0) {
                this.timer--;
            } else {
                clearInterval(countdown);
                window.location.href = 'index.html';
            }
        }, 1000);
    }
}">

    <div class="bg-glow"></div>

    <div class="hero-bg">
        <div class="grid-pattern" style="opacity: 0.5;"></div>
    </div>

    <main class="success-portal" data-aos="zoom-in">
        <div class="success-badge text-center">
            <div class="icon-ring">
                <div class="pulse-circle"></div>
                <div class="pulse-circle" style="animation-delay: 1s;"></div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <h1 class="text-4xl md:text-6xl font-black mb-10 leading-tight bg-gradient-to-r from-white via-[var(--accent)] to-white bg-clip-text text-transparent"
                x-text="t.thanksTitle || 'Message Sent!'"></h1>

            <p class="text-xl md:text-2xl text-gray-400 mb-16 font-medium max-w-lg mx-auto leading-relaxed"
                x-text="t.thanksMessage || 'I have received your message and will get back to you shortly.'"></p>

            <div class="flex flex-col items-center gap-6">
                <a href="index.html"
                    class="btn btn-primary px-12 py-4 rounded-full text-lg font-bold transition-all hover:scale-105 active:scale-95 flex items-center gap-3">
                    <span x-text="t.backHome || 'Return Home'"></span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                </a>

                <p class="text-gray-500 text-sm font-mono tracking-widest">
                    <span x-text="locale === 'ar' ? 'العودة تلقائياً في' : 'AUTO-REDIRECT IN'"></span>
                    <span class="text-[var(--accent)] font-bold" x-text="timer + 's'"></span>
                </p>
            </div>

            <div class="countdown-bar"></div>
        </div>
    </main>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>

</html>
