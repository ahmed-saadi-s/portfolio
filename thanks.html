<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You! - Ahmed Saadi</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 5L93 28V72L50 95L7 72V28L50 5Z' fill='%2306b6d4' stroke='none'/><path d='M38 35L28 50L38 65' stroke='%23f1f5f9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M56 30L44 70' stroke='%23f1f5f9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M62 35L72 50L62 65' stroke='%23f1f5f9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Translations -->
    <script src="js/i18n.js"></script>

    <style>
        .thanks-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
    </style>
</head>

<body x-data="{
      locale: localStorage.getItem('portfolio-lang') || 'en',
      t: translations[localStorage.getItem('portfolio-lang') || 'en'],
      init() {
        document.documentElement.setAttribute('dir', this.t.dir);
        document.documentElement.setAttribute('lang', this.t.lang);
        document.body.style.fontFamily = this.t.fontFamily;
      }
    }" x-init="init()">
    <div class="hero-bg">
        <div class="grid-pattern"></div>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <section class="thanks-page relative z-10">
        <div class="container">
            <div class="glass-card max-w-lg mx-auto p-12" data-aos="zoom-in">
                <div class="success-icon animate-pulse-glow">✓</div>

                <h1 class="text-3xl font-bold mb-4 text-[var(--accent)]" x-text="t.thanksTitle || 'Thank You!'"></h1>

                <p class="text-[var(--text-secondary)] mb-8 text-lg"
                    x-text="t.thanksMessage || 'Your message has been sent successfully. I will get back to you soon.'">
                </p>

                <a href="index.html" class="btn btn-primary inline-flex">
                    <span x-text="t.backHome || 'Back to Home'"></span>
                    <span>←</span>
                </a>
            </div>
        </div>
    </section>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true,
        });
    </script>
</body>

</html>
