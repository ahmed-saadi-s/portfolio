<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent — Ahmed Saadi</title>

  <!-- Theme resolution: runs before the stylesheet so this page inherits the
       exact theme chosen on index.html instead of falling back to the OS. -->
  <script src="js/theme.js"></script>

  <meta name="theme-color" content="#F5F0E8" />

  <!-- Favicon: A+S monogram; theme.js swaps in the dark plate -->
  <link id="favicon" rel="icon" type="image/png" sizes="64x64" href="assets/brand/favicon-light.png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Shared styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Translations -->
  <script src="js/i18n.js"></script>

  <style>
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fine grid overlay */
    .thanks-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(var(--rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.5;
    }

    /* Oxblood left rule */
    .thanks-rule {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--oxblood);
    }

    .thanks-panel {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      padding: 2rem;
    }

    .thanks-card {
      background: var(--bg-card);
      border: 1px solid var(--rule-strong);
      padding: 0;
      overflow: hidden;
    }

    /* Header strip */
    .thanks-header-strip {
      background: var(--oxblood);
      padding: 1rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .thanks-header-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      /* solid theme-aware ink: 10.3:1 on light oxblood, 5.5:1 on dark oxblood.
         The old rgba(paper, .6) dropped below AA in both themes. */
      color: var(--btn-primary-text);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .thanks-header-mark {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--btn-primary-text);
      letter-spacing: 0.08em;
    }

    .thanks-body {
      padding: 3rem 2.5rem 2.5rem;
    }

    .thanks-icon {
      width: 48px;
      height: 48px;
      border: 1px solid var(--rule-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      color: var(--oxblood);
      font-size: 1.1rem;
    }

    .thanks-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    [dir="rtl"] .thanks-title {
      font-family: var(--font-ar);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.4;
    }

    .thanks-underline {
      display: block;
      width: 48px;
      height: 2px;
      background: var(--oxblood);
      margin-bottom: 1.5rem;
    }

    .thanks-message {
      color: var(--stone);
      font-size: 0.95rem;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .thanks-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: flex-start;
    }

    [dir="rtl"] .thanks-actions { align-items: flex-end; }

    .thanks-redirect {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--stone-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .thanks-redirect-count {
      color: var(--oxblood);
      font-weight: 600;
    }

    /* Countdown bar at bottom */
    .thanks-progress {
      height: 2px;
      background: var(--rule);
      position: relative;
      overflow: hidden;
    }

    .thanks-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: var(--oxblood);
      animation: countdown-fill 5s linear forwards;
      transform-origin: left;
    }

    [dir="rtl"] .thanks-progress-fill {
      left: auto;
      right: 0;
      transform-origin: right;
    }

    @keyframes countdown-fill {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* Fade in the card */
    .thanks-panel {
      animation: thanks-appear 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes thanks-appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>

<body x-data="{
    locale: localStorage.getItem('portfolio-lang') || 'en',
    t: translations[localStorage.getItem('portfolio-lang') || 'en'],
    timer: 5,
    init() {
      document.documentElement.setAttribute('dir', this.t.dir);
      document.documentElement.setAttribute('lang', this.t.lang);
      document.body.style.fontFamily = this.t.fontFamily;
      const interval = setInterval(() => {
        if (this.timer > 0) {
          this.timer--;
        } else {
          clearInterval(interval);
          window.location.href = 'index.html';
        }
      }, 1000);
    }
  }" x-init="init()">

  <!-- Background -->
  <div class="thanks-bg" aria-hidden="true"></div>
  <div class="thanks-rule" aria-hidden="true"></div>

  <main class="thanks-panel" role="main">
    <div class="thanks-card">
      <!-- Header strip -->
      <div class="thanks-header-strip">
        <span class="thanks-header-label">Message Received</span>
        <span class="thanks-header-mark" x-text="locale === 'ar' ? 'أحمد سعدي' : 'Ahmed Saadi'"></span>
      </div>

      <!-- Body -->
      <div class="thanks-body">
        <!-- Check icon -->
        <div class="thanks-icon" aria-hidden="true">✓</div>

        <h1 class="thanks-title" x-text="t.thanksTitle || 'Message Sent!'"></h1>
        <span class="thanks-underline" aria-hidden="true"></span>

        <p class="thanks-message"
          x-text="t.thanksMessage || 'Thanks for reaching out. I\'ve received your message and will get back to you shortly.'">
        </p>

        <div class="thanks-actions">
          <a href="index.html" class="btn btn-primary">
            <span x-text="t.backHome || 'Back to Home'"></span>
            <span aria-hidden="true">→</span>
          </a>
          <p class="thanks-redirect">
            <span x-text="locale === 'ar' ? 'العودة تلقائياً في' : 'Auto-redirect in'"></span>
            <span class="thanks-redirect-count" x-text="timer + 's'"></span>
          </p>
        </div>
      </div>

      <!-- Countdown bar -->
      <div class="thanks-progress" aria-hidden="true">
        <div class="thanks-progress-fill"></div>
      </div>
    </div>
  </main>

</body>

</html>
